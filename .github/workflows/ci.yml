name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Links (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pytest installieren
        run: python -m pip install pytest
      - name: Hook- und Konfigurationstests
        run: python -m pytest tests/ -q
      - name: Markdown-Links prüfen
        run: python tools/check_links.py
